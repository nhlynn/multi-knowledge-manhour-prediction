{% extends "auth_base.html" %}
{% block title %}Reset Link Expired{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">This reset link has expired</div>
    <div class="card-body text-center">
        <p class="text-muted mb-4">
            Password reset links expire after a short time for your security.
            Request a new one to continue.
        </p>
        <a href="{{ url_for('auth.forgot_password_page') }}" class="btn btn-primary w-100">
            Request a new reset link
        </a>
        <div class="mt-3">
            <a href="{{ url_for('auth.login_page') }}" class="small">Back to sign in</a>
        </div>
    </div>
</div>
{% endblock %}
