{% extends "base.html" %}
{% block title %}Teams{% endblock %}
{% block content %}
<h2 class="mb-3">Teams</h2>
<div class="card">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Slug</th>
                    <th>Created At</th>
                </tr>
            </thead>
            <tbody>
                {% for team in teams %}
                <tr>
                    <td>{{ team.name }}</td>
                    <td>{{ team.slug }}</td>
                    <td>{{ team.created_at }}</td>
                </tr>
                {% else %}
                <tr><td colspan="3" class="text-muted text-center py-4">No teams found.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
