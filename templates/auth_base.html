<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Login{% endblock %} - MHES</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --surface: #ffffff;
            --surface-secondary: #f8fafc;
            --border: #e2e8f0;
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --radius-lg: 12px;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--surface-secondary);
            color: var(--text-primary);
            font-size: 0.875rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .auth-wrapper { width: 100%; max-width: 380px; }
        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.625rem;
            margin-bottom: 1.5rem;
        }
        .auth-brand-icon {
            width: 36px; height: 36px;
            border-radius: 9px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 1rem;
            box-shadow: 0 2px 8px rgba(99,102,241,0.35);
        }
        .auth-brand-text { font-weight: 700; font-size: 1.125rem; color: var(--text-primary); }
        .card {
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            background: var(--surface);
        }
        .card-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            padding: 0.875rem 1.25rem;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }
        .card-body { padding: 1.25rem; }
        .form-control {
            border-radius: 8px;
            border: 1.5px solid var(--border);
            font-size: 0.8125rem;
            padding: 0.5625rem 0.875rem;
        }
        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
        }
        .form-label { font-weight: 500; font-size: 0.8125rem; margin-bottom: 0.375rem; }
        .btn-primary { background: var(--accent); border-color: var(--accent); border-radius: 8px; font-weight: 500; }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .alert { border-radius: 8px; font-size: 0.8125rem; border: none; }
        .alert-info { background: #eff6ff; color: #1d4ed8; }
        .alert-warning { background: #fffbeb; color: #92400e; }
        .alert-danger { background: #fef2f2; color: #991b1b; }
        .alert-success { background: #f0fdf4; color: #14532d; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-brand">
            <div class="auth-brand-icon"><i class="bi bi-clock-history"></i></div>
            <span class="auth-brand-text">MHES</span>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
